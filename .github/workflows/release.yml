name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      artifacts_only:
        description: 'Build signed installers without changing the version or creating a release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10.28.1

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.artifacts_only }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '["ubuntu-24.04-arm"]') }}
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Ensure tag does not exist
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi

      - name: Update desktop version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/desktop/package.json';
          const version = process.env.RELEASE_VERSION;
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (pkg.version === version) {
            console.error(`apps/desktop/package.json already at ${version}.`);
            process.exit(1);
          }
          pkg.version = version;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Commit and tag
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json
          git commit -m "Bump version to ${RELEASE_VERSION}"
          git tag "v${RELEASE_VERSION}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${RELEASE_VERSION}"

      - id: ref
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "ref=refs/tags/v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

  test:
    needs:
      - prepare
    if: ${{ always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '["ubuntu-24.04-arm"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref != '' && needs.prepare.outputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

  build:
    needs: [ test, prepare ]
    environment: mac-build
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_MACOS || '["macos-26"]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref != '' && needs.prepare.outputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Clean previous installers
        run: rm -rf apps/desktop/dist/*

      - name: Build desktop app
        run: pnpm run build:desktop

      - name: Prepare notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          printenv APPLE_API_KEY_CONTENT > "$RUNNER_TEMP/notarization.p8"
          test -s "$RUNNER_TEMP/notarization.p8"

      - name: Package macOS app
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY: ${{ runner.temp }}/notarization.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.ts --mac --"$BUILD_ARCH" --publish never -c.forceCodeSigning=true -c.mac.notarize=true

      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notarization.p8"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: apps/desktop/dist/**/*
          if-no-files-found: error
          retention-days: 1
    if: "${{ !cancelled() && needs.test.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}"

  publish:
    needs: [ build, prepare ]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_LINUX || '["ubuntu-24.04-arm"]') }}
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag != '' && needs.prepare.outputs.tag || github.ref_name }}
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: "${{ !inputs.artifacts_only && (!cancelled() && needs.build.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')) }}"
