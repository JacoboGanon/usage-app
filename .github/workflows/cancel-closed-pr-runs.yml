name: Cancel runs of closed pull requests
on:
  pull_request:
    types: [closed]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the pull request's queued and running workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          CLOSED_AT: ${{ github.event.pull_request.closed_at }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Fork pull requests never run on the Mini, and their token cannot cancel runs.
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then exit 0; fi
          for status in queued waiting pending requested in_progress; do
            gh api --paginate "repos/$REPOSITORY/actions/runs?branch=$BRANCH&status=$status&per_page=100" \
              --jq ".workflow_runs[] | select(.event == \"pull_request\" and .created_at < \"$CLOSED_AT\" and .id != $CURRENT_RUN) | .id"
          done | sort -u | while read -r id; do
            gh api -X POST "repos/$REPOSITORY/actions/runs/$id/cancel" >/dev/null || echo "Could not cancel run $id"
          done
